name: Build Yalla TLS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Android ARM64
        run: |
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -v -o yalla_tls_arm64 yalla_tls.go

      - name: Build Linux x86_64
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -v -o yalla_tls_linux yalla_tls.go

      - name: Upload ARM64
        uses: actions/upload-artifact@v4
        with:
          name: yalla-tls-arm64
          path: yalla_tls_arm64

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: yalla-tls-linux
          path: yalla_tls_linux
